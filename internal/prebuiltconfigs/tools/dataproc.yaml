sources:
  dataproc-source:
    kind: dataproc
    project: ${DATAPROC_PROJECT}
    region: ${DATAPROC_REGION}
  serverless-spark-source:
    kind: serverless-spark
    project: ${DATAPROC_PROJECT}
    location: ${DATAPROC_REGION}

tools:
  list_clusters:
    kind: dataproc-list-clusters
    source: dataproc-source
  list_jobs:
    kind: dataproc-list-jobs
    source: dataproc-source
  list_batches:
    kind: serverless-spark-list-batches
    source: serverless-spark-source
  list_executors:
    kind: serverless-spark-list-executors
    source: serverless-spark-source

toolsets:
  dataproc_tools:
    - list_clusters
    - list_jobs
  serverless_spark_tools:
    - list_batches
    - list_executors
